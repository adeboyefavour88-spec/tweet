<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 350px;
        height: 100px;
        border-radius: 5px;
        border: solid rgb(237, 233, 233);
      }
      img {
        width: 90px;
        height: 90px;
        border-radius: 45px;
        display: inline-block;
        margin-left: 10px;
        margin-top: 5px;
        margin-bottom: 5px;
      }
      p {
        font-family: "Times New Roman", Times, serif;
        color: rgb(150, 148, 148);
        display: inline-block;
        margin-bottom: 30px;
        margin-left: 10px;
        margin-right: 25px;
        margin-top: 40px;
        vertical-align: top;
      }
      button {
        color: white;
        background-color: rgb(0, 149, 255);
        border-radius: 15px;
        padding-bottom: 5px;
        padding-left: 10px;
        padding-right: 10px;
        padding-top: 5px;
        margin-bottom: 30px;
        margin-left: 10px;
        margin-right: 0;
        vertical-align: 45px;
        font-size: 15px;
        border: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div>
      <img src="blackguy.png" alt="Confident Studio Portrait of a Young Man" />
      <p>What's happening?</p>
      <button>Tweet</button>
    </div>
  </body>
</html>
